<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Pages — Admin — LandingForge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="forge.css">
<style>
.page-heading { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.heading-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.search-input { width: 240px; }

/* Filter row */
.filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
.filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

/* Bulk bar */
.bulk-bar {
  background: rgba(220,38,38,.08); border: 1px solid rgba(220,38,38,.2);
  border-radius: var(--r); padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; gap: 12px;
  animation: slide-down .2s ease both;
}
@keyframes slide-down { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }

/* Table styles */
.table-container { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow-card); }
table { width: 100%; border-collapse: collapse; }
thead th { background: rgba(8,8,20,.5); padding: 10px 14px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
thead th:first-child { width: 42px; }
tbody tr { border-bottom: 1px solid rgba(42,42,64,.7); transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(26,26,48,.8); }
tbody tr.selected { background: rgba(99,102,241,.06); }
tbody td { padding: 12px 14px; font-size: 13px; color: var(--fg); vertical-align: middle; }
.slug-cell { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--primary); }
.title-cell { font-weight: 500; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.date-cell { color: var(--muted); white-space: nowrap; }
.actions-cell { display: flex; align-items: center; gap: 4px; }

/* Pagination */
.pagination { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
.pag-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-family: inherit; transition: all .15s; }
.pag-btn:hover:not(:disabled) { border-color: rgba(99,102,241,.5); color: var(--fg); }
.pag-btn:disabled { opacity: .35; cursor: not-allowed; }

/* Empty state */
.empty-state { padding: 64px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty-icon { width: 48px; height: 48px; color: var(--border); }

/* Mobile card rows */
@media (max-width: 768px) {
  .desktop-col { display: none; }
  table { display: block; }
  thead { display: none; }
  tbody { display: flex; flex-direction: column; gap: 0; }
  tbody tr { display: flex; flex-direction: column; padding: 14px 16px; gap: 8px; border-bottom: 1px solid var(--border); }
  tbody td { padding: 0; border: none; }
  .search-input { width: 160px; }
  .filter-sep { display: none; }
}
</style>
</head>
<body>
<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div style="display:flex;align-items:center;gap:8px;">
        <a href="Home.html" style="display:flex;align-items:center;gap:7px;text-decoration:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span style="font-size:14px;font-weight:700;color:#EDEDE5">Landing<span style="color:#6366F1">Forge</span></span>
        </a>
        <span class="badge badge-primary" style="font-size:9px;padding:2px 7px;">Admin</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="Admin - Dashboard.html" class="nav-item">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="Admin - Generate.html" class="nav-item">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        Generate
      </a>
      <a href="Admin - Pages.html" class="nav-item active">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        All Pages
      </a>
      <a href="Admin - Schedule.html" class="nav-item">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Schedule
      </a>
      <a href="#" class="nav-item">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        Settings
      </a>
    </nav>
    <div class="sidebar-footer">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="avatar">AC</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:500;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Alex Chen</div>
          <span class="badge badge-primary" style="font-size:9px;padding:2px 7px;margin-top:2px;">admin</span>
        </div>
        <button class="btn btn-icon btn-ghost" onclick="window.location='Login.html'" style="color:var(--muted);flex-shrink:0;" title="Sign out">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="admin-body">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="btn btn-icon btn-ghost" onclick="toggleSidebar()" id="hamburger" style="display:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span style="font-size:13px;color:var(--muted);">Admin</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--border)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        <span style="font-size:13px;font-weight:500;color:var(--fg);">All Pages</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <a href="Admin - Generate.html" class="btn btn-primary btn-sm">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New page
        </a>
        <button class="btn btn-icon btn-ghost" style="color:var(--muted);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
      </div>
    </div>

    <div class="admin-content page-in">
      <!-- Heading row -->
      <div class="heading-row">
        <h1 class="page-heading">All Pages</h1>
        <span class="badge badge-muted" style="font-size:11px;padding:4px 10px;">24 pages</span>
        <div style="margin-left:auto;">
          <input class="input search-input" type="search" placeholder="Search pages…" oninput="filterTable(this.value)" style="font-size:13px;">
        </div>
      </div>

      <!-- Filter row -->
      <div class="filter-row">
        <button class="filter-pill active" onclick="setPillGroup(this,'status')">All</button>
        <button class="filter-pill" onclick="setPillGroup(this,'status')">Published</button>
        <button class="filter-pill" onclick="setPillGroup(this,'status')">Draft</button>
        <div class="filter-sep"></div>
        <button class="filter-pill active" onclick="setPillGroup(this,'source')">All</button>
        <button class="filter-pill" onclick="setPillGroup(this,'source')">AI Generated</button>
        <button class="filter-pill" onclick="setPillGroup(this,'source')">Manual</button>
        <button class="filter-pill" onclick="setPillGroup(this,'source')">Daily Cron</button>
        <div style="margin-left:auto;">
          <button class="btn btn-danger btn-sm" id="bulk-delete-btn" disabled onclick="bulkDelete()" style="opacity:.35;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg>
            Bulk delete
          </button>
        </div>
      </div>

      <!-- Bulk bar -->
      <div class="bulk-bar" id="bulk-bar" style="display:none;">
        <span style="font-size:13px;color:var(--danger);font-weight:500;" id="bulk-count">0 rows selected</span>
        <button class="btn btn-danger btn-sm" onclick="bulkDelete()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg>
          Delete selected
        </button>
      </div>

      <!-- Table -->
      <div class="table-container" id="table-wrap">
        <table id="pages-table">
          <thead>
            <tr>
              <th><input type="checkbox" id="select-all" onchange="toggleAll(this)" style="accent-color:var(--primary);cursor:pointer;"></th>
              <th>Slug</th>
              <th>Title</th>
              <th class="desktop-col">Source</th>
              <th>Status</th>
              <th class="desktop-col">Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="table-body">
          </tbody>
        </table>
        <div class="pagination">
          <button class="pag-btn" disabled>← Previous</button>
          <span>Page 1 of 4</span>
          <button class="pag-btn">Next →</button>
        </div>
      </div>

    </div>
  </div>
</div>
<div class="mobile-overlay" id="overlay" onclick="toggleSidebar()"></div>
<div class="toast-stack" id="toasts"></div>

<script>
const pages = [
  { slug:'/l/2026-06-08-quantum-edge-labs', title:'QuantumEdge Labs — Post-quantum cryptography toolkit', source:'cron', status:'published', date:'Jun 8, 2026' },
  { slug:'/l/2026-06-07-rustflow-labs',     title:'RustFlow Labs — Async Rust runtime for edge functions', source:'cron', status:'published', date:'Jun 7, 2026' },
  { slug:'/l/2026-06-06-sleeptrack-ai',     title:'SleepTrack AI — Intelligent sleep coaching', source:'ai',   status:'published', date:'Jun 6, 2026' },
  { slug:'/l/2026-06-05-edgecompute-dev',   title:'EdgeCompute.dev — Serverless at the edge', source:'cron', status:'published', date:'Jun 5, 2026' },
  { slug:'/l/2026-06-04-cryptovault-co',    title:'CryptoVault — Non-custodial crypto wallet', source:'ai',   status:'published', date:'Jun 4, 2026' },
  { slug:'/l/2026-06-03-devharbor-io',      title:'DevHarbor — Open-source team collaboration', source:'manual', status:'draft', date:'Jun 3, 2026' },
  { slug:'/l/2026-06-02-neuralnews-io',     title:'NeuralNews — AI-curated tech headlines', source:'cron', status:'published', date:'Jun 2, 2026' },
  { slug:'/l/2026-06-01-greenledger-app',   title:'GreenLedger — Carbon accounting for enterprises', source:'manual', status:'draft', date:'Jun 1, 2026' },
];

const sourceBadge = {
  cron: '<span class="badge badge-primary">cron</span>',
  ai:   '<span class="badge badge-purple">ai</span>',
  manual:'<span class="badge badge-muted">manual</span>',
};
const statusBadge = {
  published: '<span class="badge badge-success">published</span>',
  draft:     '<span class="badge badge-warning">draft</span>',
};

function renderTable(data) {
  const tbody = document.getElementById('table-body');
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <div style="font-size:15px;font-weight:600;color:var(--fg);">No pages yet</div>
      <a href="Admin - Generate.html" style="font-size:13px;color:var(--primary);">Generate your first landing page →</a>
    </div></td></tr>`;
    return;
  }
  tbody.innerHTML = data.map((p,i) => `
    <tr id="row-${i}" onclick="toggleRow(${i},event)">
      <td><input type="checkbox" class="row-cb" data-i="${i}" onclick="e=>e.stopPropagation()" onchange="updateBulk()" style="accent-color:var(--primary);cursor:pointer;"></td>
      <td class="slug-cell">${p.slug}</td>
      <td class="title-cell desktop-col">${p.title}</td>
      <td class="desktop-col">${sourceBadge[p.source]}</td>
      <td>${statusBadge[p.status]}</td>
      <td class="date-cell desktop-col">${p.date}</td>
      <td class="actions-cell">
        <a href="#" class="btn btn-icon btn-ghost" title="Preview" style="color:var(--muted);" onmouseenter="this.style.color='var(--fg)'" onmouseleave="this.style.color='var(--muted)'">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </a>
        <button class="btn btn-icon btn-ghost" title="Delete" style="color:var(--muted);" onmouseenter="this.style.color='var(--danger)'" onmouseleave="this.style.color='var(--muted)'" onclick="deletePage(${i},event)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </td>
    </tr>
  `).join('');
}
renderTable(pages);

function toggleRow(i, e) {
  if (e.target.type === 'checkbox') return;
  const cb = document.querySelector(`.row-cb[data-i="${i}"]`);
  cb.checked = !cb.checked;
  document.getElementById('row-' + i).classList.toggle('selected', cb.checked);
  updateBulk();
}
function toggleAll(cb) {
  document.querySelectorAll('.row-cb').forEach((c,i) => {
    c.checked = cb.checked;
    document.getElementById('row-' + i)?.classList.toggle('selected', cb.checked);
  });
  updateBulk();
}
function updateBulk() {
  const sel = document.querySelectorAll('.row-cb:checked').length;
  const bar = document.getElementById('bulk-bar');
  const bulkBtn = document.getElementById('bulk-delete-btn');
  bar.style.display = sel > 0 ? 'flex' : 'none';
  document.getElementById('bulk-count').textContent = sel + ' row' + (sel!==1?'s':'') + ' selected';
  bulkBtn.disabled = sel === 0;
  bulkBtn.style.opacity = sel > 0 ? '1' : '.35';
}
function deletePage(i, e) {
  e.stopPropagation();
  const row = document.getElementById('row-' + i);
  row.style.opacity = '.3';
  setTimeout(() => { row.remove(); showToast('success','Page deleted.'); }, 300);
}
function bulkDelete() {
  document.querySelectorAll('.row-cb:checked').forEach(cb => {
    const row = document.getElementById('row-' + cb.dataset.i);
    if (row) row.remove();
  });
  document.getElementById('bulk-bar').style.display = 'none';
  showToast('success','Selected pages deleted.');
}
function filterTable(q) {
  const filtered = pages.filter(p => p.slug.includes(q.toLowerCase()) || p.title.toLowerCase().includes(q.toLowerCase()));
  renderTable(filtered);
}
function setPillGroup(el, group) {
  const parent = el.closest('.filter-row');
  const sameSrc = [...parent.querySelectorAll('.filter-pill')].filter(p => {
    const idx = [...parent.querySelectorAll('.filter-pill')].indexOf(p);
    const elIdx = [...parent.querySelectorAll('.filter-pill')].indexOf(el);
    return group === 'status' ? idx < 3 : idx >= 4;
  });
  sameSrc.forEach(p => p.classList.remove('active'));
  el.classList.add('active');
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
if (window.innerWidth <= 768) document.getElementById('hamburger').style.display = 'flex';
function showToast(type, msg) {
  const stack = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.innerHTML = `<span style="font-size:13px;flex:1;">${msg}</span><button class="toast-dismiss" onclick="this.parentElement.remove()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
  stack.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}
</script>
</body>
</html>
