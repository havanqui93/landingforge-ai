<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — LandingForge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="forge.css">
<style>
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  /* subtle dot grid */
  background-image: radial-gradient(circle, rgba(99,102,241,.06) 0%, transparent 65%),
    radial-gradient(rgba(42,42,64,.8) 1px, transparent 1px);
  background-size: 100% 100%, 28px 28px;
  padding: 24px;
}

.auth-card {
  width: 100%;
  max-width: 480px;
  background: rgba(22,22,38,.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 0 0 1px var(--border), 0 8px 40px rgba(0,0,0,.5), 0 0 60px rgba(99,102,241,.07);
  animation: card-in .3s cubic-bezier(.22,1,.36,1) both;
}

@keyframes card-in {
  from { opacity: 0; transform: translateY(12px) scale(.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.auth-logo { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.auth-heading { font-size: 28px; font-weight: 700; text-align: center; margin-top: 28px; letter-spacing: -.02em; }
.auth-sub { font-size: 14px; color: var(--muted); text-align: center; margin-top: 8px; line-height: 1.5; }

.auth-form { display: flex; flex-direction: column; gap: 16px; margin-top: 32px; }

.forgot-row { display: flex; justify-content: flex-end; }
.forgot-link { font-size: 12px; color: var(--primary); text-decoration: none; }
.forgot-link:hover { text-decoration: underline; }

.google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; }
.google-icon { width: 17px; height: 17px; flex-shrink: 0; }

.auth-footer { margin-top: 28px; text-align: center; font-size: 13px; color: var(--muted); }
.auth-footer a { color: var(--primary); font-weight: 500; }
.auth-footer a:hover { text-decoration: underline; }

.field-msg { display: flex; align-items: center; gap: 5px; font-size: 12px; margin-top: 4px; }
.field-msg.error { color: var(--danger); }

/* eye toggle */
.pw-wrap { position: relative; }
.pw-wrap .input { padding-right: 42px; }
.eye-btn {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--muted); cursor: pointer;
  padding: 4px; display: flex; align-items: center; border-radius: 6px;
}
.eye-btn:hover { color: var(--fg); }

@media (max-width: 600px) {
  .auth-card { padding: 28px 20px; backdrop-filter: none; -webkit-backdrop-filter: none; }
}
</style>
</head>
<body>

<div class="auth-card page-in">
  <!-- Logo -->
  <a href="Home.html" class="auth-logo" style="text-decoration:none;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    <span style="color:#EDEDE5">Landing</span><span style="color:#6366F1">Forge</span>
  </a>

  <h1 class="auth-heading">Welcome back</h1>
  <p class="auth-sub">Sign in to generate and manage landing pages.</p>

  <form class="auth-form" id="login-form" onsubmit="doLogin(event)">
    <!-- Email -->
    <div class="form-group">
      <label class="label" for="email">Email address</label>
      <input class="input" id="email" type="email" autocomplete="email" placeholder="you@company.com">
      <div class="field-msg error" id="email-err" style="display:none;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Please enter a valid email address.
      </div>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label class="label" for="password">Password</label>
      <div class="pw-wrap">
        <input class="input" id="password" type="password" autocomplete="current-password" placeholder="Your password">
        <button type="button" class="eye-btn" onclick="togglePw('password', this)" aria-label="Show password">
          <svg id="eye-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="field-msg error" id="pw-err" style="display:none;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Incorrect password. Try again.
      </div>
    </div>

    <div class="forgot-row">
      <a href="#" class="forgot-link">Forgot password?</a>
    </div>

    <button type="submit" class="btn btn-primary btn-full" id="signin-btn" style="height:44px;font-size:14px;">
      Sign in
    </button>
  </form>

  <!-- Divider -->
  <div class="divider" style="margin-top:24px;">or continue with</div>

  <!-- Google -->
  <button class="btn btn-secondary btn-full google-btn" style="margin-top:14px;height:42px;" onclick="googleSignIn()">
    <svg class="google-icon" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Continue with Google
  </button>

  <div class="auth-footer">
    Don't have an account? <a href="Register.html">Sign up →</a>
  </div>
</div>

<!-- State demo bar -->
<div style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:6px 16px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:12px;z-index:50;box-shadow:var(--shadow-elevated);white-space:nowrap;">
  Show state:
  <button class="btn btn-sm btn-secondary" onclick="showError()">Error state</button>
  <button class="btn btn-sm btn-secondary" onclick="showLoading()">Loading state</button>
  <button class="btn btn-sm btn-secondary" onclick="resetForm()">Reset</button>
</div>

<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  const showing = inp.type === 'text';
  inp.type = showing ? 'password' : 'text';
  btn.innerHTML = showing
    ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
    : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
}

function doLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const pw = document.getElementById('password').value;
  clearErrors();
  let valid = true;
  if (!email || !email.includes('@')) {
    document.getElementById('email-err').style.display = 'flex';
    document.getElementById('email').classList.add('error');
    valid = false;
  }
  if (!pw) {
    document.getElementById('pw-err').style.display = 'flex';
    document.getElementById('password').classList.add('error');
    valid = false;
  }
  if (!valid) return;
  showLoading();
  setTimeout(() => { window.location.href = 'Home.html'; }, 1600);
}

function showError() {
  clearErrors();
  document.getElementById('email').value = 'bad-email';
  document.getElementById('email').classList.add('error');
  document.getElementById('email-err').style.display = 'flex';
  document.getElementById('password').value = 'wrongpass';
  document.getElementById('password').classList.add('error');
  document.getElementById('pw-err').style.display = 'flex';
}

function showLoading() {
  const btn = document.getElementById('signin-btn');
  btn.innerHTML = '<span class="spinner"></span> Signing in…';
  btn.disabled = true;
  document.getElementById('email').disabled = true;
  document.getElementById('password').disabled = true;
}

function resetForm() {
  clearErrors();
  document.getElementById('signin-btn').innerHTML = 'Sign in';
  document.getElementById('signin-btn').disabled = false;
  document.getElementById('email').disabled = false;
  document.getElementById('password').disabled = false;
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
}

function clearErrors() {
  document.getElementById('email-err').style.display = 'none';
  document.getElementById('pw-err').style.display = 'none';
  document.getElementById('email').classList.remove('error');
  document.getElementById('password').classList.remove('error');
}

function googleSignIn() {
  const btn = event.currentTarget;
  btn.innerHTML = '<span class="spinner" style="border-top-color:var(--primary);border-color:rgba(99,102,241,.2)"></span> Redirecting…';
  btn.disabled = true;
}
</script>
</body>
</html>
