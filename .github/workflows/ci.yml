name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The registry's exhaustive `switch` + `never` branch makes this the
      # contract that every landing config is valid and complete.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Structural invariants the type system can't express
      # (hero-first/footer-last, unique URL-safe slugs, RGB triples, real icons).
      - name: Test
        run: npm test

      # Proves every registered landing actually pre-renders.
      - name: Build
        run: npm run build
        env:
          # Build only needs the Prisma client generated, not a live DB.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
